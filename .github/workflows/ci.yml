name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      release_version:
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: gateway-ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install locked public dependencies
        run: pnpm install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run build
      - run: npm run docs:check
      - name: Full regression and boundary tests
        if: runner.os != 'Windows'
        run: npm run test:ci
      - name: Release contract tests
        run: node --test test/release-ci.test.mjs
      - name: Pack distribution
        run: npm run pack:release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - name: Install and consume packed SDK and CLI outside checkout
        run: npm run test:package
      - name: Check manifest and lockfile drift
        run: git diff --exit-code -- package.json pnpm-lock.yaml
      - name: Upload verified distribution
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-package
          path: .tmp/release/*.tgz
          if-no-files-found: error
          retention-days: 7
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 .octospec/scripts/lint.py
  gate:
    name: CI Gate
    if: always()
    needs: [check, spec]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every check
        env:
          CHECK: ${{ needs.check.result }}
          SPEC: ${{ needs.spec.result }}
        run: test "$CHECK" = success && test "$SPEC" = success
