name: npm Publish
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated stable tag (vX.Y.Z) on main
        required: true
        type: string
      dry_run:
        description: Validate without publishing to npm
        type: boolean
        default: true
permissions: {}
concurrency:
  group: gateway-npm-publish
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate immutable release source
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node scripts/validate-release.mjs
  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      release_version: ${{ needs.validate.outputs.version }}
    permissions:
      contents: read
  publish:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gateway-package
          path: release
      - name: Publish the verified archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ARCHIVE="release/mininglamp-oss-octo-channel-gateway-$VERSION.tgz"
          test -f "$ARCHIVE"
          if [ "$DRY_RUN" = true ]; then
            npm publish "$ARCHIVE" --ignore-scripts --access public --dry-run
          else
            test -n "$NODE_AUTH_TOKEN" || { echo "::error::Configure NPM_TOKEN before publishing"; exit 1; }
            npm publish "$ARCHIVE" --ignore-scripts --access public --provenance --tag latest
          fi
