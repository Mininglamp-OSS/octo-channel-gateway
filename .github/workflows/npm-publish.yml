name: npm Publish
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated stable tag (vX.Y.Z) on main
        required: true
        type: string
      dry_run:
        description: Validate without changing npm or GitHub Releases
        type: boolean
        default: true
      recover_existing:
        description: Repair Release/latest using the original published npm archive (no republish)
        type: boolean
        default: false
permissions: {}
concurrency:
  group: gateway-npm-publish
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate immutable release source
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node scripts/validate-release.mjs
  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      release_version: ${{ needs.validate.outputs.version }}
    permissions:
      contents: read
  publish:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      # 手动恢复旧 tag 时使用本次工作流的发布工具，不依赖旧源码包含新工具。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gateway-package
          path: release
      - name: Confirm npm, GitHub Release, assets and latest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RECOVER_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_existing }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
